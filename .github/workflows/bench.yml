# The benches of collections. The suite hash compares defaultHash with the hash of versions 0.2.0
# and earlier. The suite layers compares compose with the fold of version 0.3.0. Each arm of each case and round runs in a fresh process, and an A/A pair gives the
# noise of the same run (@mark1russell7/rigor-bench). A person starts a run after a commit adds its
# prediction. The report goes to packages/collections/bench/records in a pull request.
name: Bench

on:
  workflow_dispatch:
    inputs:
      suite:
        description: The suite to run.
        type: choice
        options: [hash, layers]
        required: true
      prediction:
        description: The id of the prediction of the run. A commit adds the prediction before the run.
        type: string
        required: true
      runs:
        description: The count of the jobs, from 1 to 9. A claim needs 5.
        type: string
        default: "5"
      rounds:
        description: The rounds of each job, 6 or more for the interval of a case.
        type: string
        default: "11"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - name: Plan the jobs
        id: plan
        env:
          RUNS: ${{ inputs.runs }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          [[ "$RUNS" =~ ^[1-9]$ ]] || { echo "runs must be a number from 1 to 9, not '$RUNS'"; exit 1; }
          [[ "$ROUNDS" =~ ^[0-9]+$ ]] && (( ROUNDS >= 6 )) || { echo "rounds must be 6 or more, not '$ROUNDS'"; exit 1; }
          echo "runs=[$(seq -s, 1 "$RUNS")]" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ inputs.suite }} bench (job ${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the job
        working-directory: packages/collections
        env:
          SUITE: ${{ inputs.suite }}
          JOB: ${{ matrix.job }}
          ROUNDS: ${{ inputs.rounds }}
        run: node --import tsx bench/run.ts --suite "$SUITE" --job "$JOB" --rounds "$ROUNDS" --out "bench-out/job-$JOB.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-job-${{ matrix.job }}
          path: packages/collections/bench-out/job-${{ matrix.job }}.json
          if-no-files-found: error

  report:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-job-*
          merge-multiple: true
          path: packages/collections/bench-out
      - name: Pool the jobs
        working-directory: packages/collections
        env:
          RUN: ${{ github.run_id }}
          PREDICTION: ${{ inputs.prediction }}
        run: |
          node --import tsx bench/report.ts --jobs bench-out --out bench-report.json --run "$RUN"
          { echo "Prediction: $PREDICTION"; echo '```json'; cat bench-report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: packages/collections/bench-report.json
          if-no-files-found: error
